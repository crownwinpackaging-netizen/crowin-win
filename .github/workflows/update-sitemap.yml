name: Regenerate sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'scripts/generate-sitemap.mjs'
      - '.github/workflows/update-sitemap.yml'
      - 'sitemap.xml'
  workflow_dispatch:

concurrency:
  group: regenerate-sitemap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Ensure SEO head tags
        run: node scripts/ensure-seo-head.mjs

      - name: Commit generated SEO files when changed
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml '*.html'; then
            echo "Sitemap and SEO head tags are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml '*.html'
          git commit -m "chore: regenerate sitemap and SEO tags"
          git push origin HEAD:main
