<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Compare the complete packing approach</title><desc id="desc">The format alone does not establish cost or protection.</desc><rect width="1440" height="800" rx="24" fill="#12121A"/><style>text{font-family:Arial,sans-serif;fill:#FFFFFF}.h{font-size:44px;font-weight:700}.s{font-size:22px;fill:#A9A9B7}.b{font-size:27px;font-weight:700}.t{font-size:23px}</style><text x="70" y="85" class="h">Compare the complete packing approach</text><text x="70" y="130" class="s">The format alone does not establish cost or protection.</text><rect x="65" y="190" width="420" height="495" rx="16" fill="#1C1C28"/><text x="89" y="240" class="b">01 / Direct gift box</text><rect x="120" y="300" width="310" height="190" rx="8" fill="#C9A84C"/><rect x="275" y="325" width="120" height="65" fill="#1C1C28"/><path d="M 290 340 h 85 m -85 12 h 85 m -85 12 h 85" stroke="#FFFFFF" stroke-width="4"/><text x="89" y="555" class="t">Only if developed</text><text x="89" y="590" class="t">for parcel distribution</text><text x="89" y="650" class="s">Check the complete packed order.</text><rect x="510" y="190" width="420" height="495" rx="16" fill="#1C1C28"/><text x="534" y="240" class="b">02 / Box inside a box</text><rect x="565" y="300" width="310" height="190" rx="8" fill="#8E7137"/><rect x="588" y="320" width="264" height="150" fill="#3B3540"/><rect x="620" y="345" width="200" height="100" fill="#C9A84C"/><text x="534" y="555" class="t">Separate presentation</text><text x="534" y="590" class="t">from the shipping surface</text><text x="534" y="650" class="s">Check the complete packed order.</text><rect x="955" y="190" width="420" height="495" rx="16" fill="#1C1C28"/><text x="979" y="240" class="b">03 / Branded mailer</text><rect x="1010" y="300" width="310" height="190" rx="8" fill="#8E7137"/><rect x="1030" y="320" width="270" height="80" fill="#C9A84C"/><text x="1060" y="372" font-size="26" fill="white" style="fill:#0A0A0F">BRAND INTERIOR</text><text x="979" y="555" class="t">Combine functions in</text><text x="979" y="590" class="t">one evaluated design</text><text x="979" y="650" class="s">Check the complete packed order.</text><text x="70" y="755" class="s">CROWN WIN / BUYER GUIDE</text><text x="930" y="755" class="s">Schematic only · Not to scale</text></svg>