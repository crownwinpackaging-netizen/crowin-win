<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><style>text{font-family:Arial,sans-serif;fill:white}.h{font-size:36px;font-weight:bold}.s{font-size:21px;fill:#ccc}.g{font-size:25px;fill:#E8C96A}</style><rect width="1000" height="460" fill="#12121a" rx="16"/><text x="40" y="58" class="h">Three ways to add an occasion</text><text x="40" y="103" class="s">Choose the detail around the opening and packing process.</text><rect x="40" y="140" width="295" height="258" rx="12" fill="#232330"/><text x="58" y="183" class="g">Sleeve</text><rect x="92" y="215" width="190" height="75" rx="4" fill="#8A743E"/><text x="58" y="335" class="s">Visible before opening</text><text x="58" y="367" class="s">Keep labels readable</text><rect x="350" y="140" width="295" height="258" rx="12" fill="#232330"/><text x="368" y="183" class="g">Ribbon</text><rect x="402" y="215" width="190" height="75" rx="4" fill="#8A743E"/><text x="368" y="335" class="s">Adds an untying step</text><text x="368" y="367" class="s">Keep the opening seam clear</text><rect x="660" y="140" width="295" height="258" rx="12" fill="#232330"/><text x="678" y="183" class="g">Card</text><rect x="712" y="215" width="190" height="75" rx="4" fill="#8A743E"/><text x="678" y="335" class="s">Adds a personal message</text><text x="678" y="367" class="s">Keep the products visible</text><text x="40" y="438" class="s">CROWN WIN / Original schematic · Concepts only</text></svg>