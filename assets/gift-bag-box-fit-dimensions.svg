<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" width="1100" height="510"><title>Size the bag around the packed gift box</title><rect width="1100" height="510" rx="14" fill="#181820"/><g font-family="Arial,sans-serif"><text x="35" y="48" fill="#e0bc59" font-size="29">Measure the packed box, then confirm usable bag space</text><g fill="#eee" font-size="22"><text x="45" y="102">TOP VIEW / usable base</text><text x="620" y="102">SIDE VIEW / body height</text></g><rect x="85" y="160" width="350" height="210" rx="5" fill="none" stroke="#e0bc59" stroke-width="3"/><rect x="115" y="190" width="290" height="150" fill="#6a5840" stroke="#ddd" stroke-width="2"/><g fill="#eee" font-size="21"><text x="150" y="270">Packed gift box</text><text x="170" y="410">Width (W) ↔</text><text x="45" y="135">Gusset (G) = opened depth</text></g><path d="M700 210V160C700 120 800 120 800 160V210" fill="none" stroke="#aaa" stroke-width="5"/><rect x="650" y="210" width="230" height="200" fill="none" stroke="#e0bc59" stroke-width="3"/><rect x="675" y="315" width="180" height="70" fill="#6a5840"/><path d="M920 210V410M910 220L920 210L930 220M910 400L920 410L930 400" fill="none" stroke="#eee" stroke-width="2"/><g fill="#eee" font-size="20"><text x="945" y="300">Body</text><text x="945" y="327">height (H)</text><text x="810" y="150">Handle drop</text></g><text x="35" y="475" fill="#ccc" font-size="19">Illustrative only; not to scale. Confirm internal/external dimensions and actual loading clearance.</text></g></svg>