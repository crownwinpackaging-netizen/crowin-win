<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Illustrative five-piece chocolate insert layout</title>
<desc id="desc">An illustrative gift-box insert layout with five differently shaped chocolate pieces in separate cavities and a reserved information panel along the lower edge.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#1b1920"/></linearGradient><linearGradient id="tray" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0e7d7"/><stop offset="1" stop-color="#cbbda8"/></linearGradient><linearGradient id="choc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b5838"/><stop offset="1" stop-color="#55291e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter></defs>
<rect width="1120" height="620" rx="24" fill="url(#bg)"/>
<text x="58" y="65" fill="#c9a84c" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">ILLUSTRATIVE INSERT PLANNING</text>
<text x="58" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Five pieces, five fit checks, one clear information area</text>
<g filter="url(#shadow)"><rect x="76" y="145" width="682" height="400" rx="26" fill="url(#tray)" stroke="#f8f1e4" stroke-width="3"/>
<g fill="#b7a992" stroke="#a2937a" stroke-width="4">
<ellipse cx="202" cy="260" rx="84" ry="64"/><path d="M355 202 Q407 181 449 217 Q475 241 452 286 Q431 326 381 319 Q337 312 330 274 Q323 235 355 202Z"/><rect x="495" y="195" width="160" height="129" rx="52"/><circle cx="214" cy="405" r="70"/><path d="M386 347 Q426 347 448 374 L472 420 Q480 437 468 451 Q454 467 432 456 L387 435 Q353 419 356 389 Q359 360 386 347Z"/>
</g>
<g fill="url(#choc)" stroke="#d6a77e" stroke-width="3">
<ellipse cx="202" cy="253" rx="62" ry="43"/><path d="M369 211 Q404 196 432 220 Q452 240 436 273 Q421 299 389 297 Q356 295 350 270 Q345 239 369 211Z"/><rect x="516" y="213" width="118" height="91" rx="38"/><circle cx="214" cy="405" r="49"/><path d="M390 359 Q419 358 435 379 L454 416 Q459 427 451 436 Q442 445 428 438 L392 421 Q368 408 371 388 Q373 369 390 359Z"/>
</g>
<g fill="#e8c59d" opacity=".92"><path d="M202 214v77M164 253h76" stroke="#e8c59d" stroke-width="5"/><path d="M389 217l36 65M353 268l86-27" stroke="#e8c59d" stroke-width="4"/><path d="M546 234h58M575 215v87" stroke="#e8c59d" stroke-width="4"/><path d="M214 371v68M180 405h68" stroke="#e8c59d" stroke-width="4"/><path d="M391 382l43 35M380 405l58-31" stroke="#e8c59d" stroke-width="4"/></g>
<g font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle"><g fill="#241b16"><circle cx="130" cy="184" r="18"/><circle cx="316" cy="184" r="18"/><circle cx="675" cy="184" r="18"/><circle cx="130" cy="345" r="18"/><circle cx="520" cy="345" r="18"/></g><g fill="#fff"><text x="130" y="190">1</text><text x="316" y="190">2</text><text x="675" y="190">3</text><text x="130" y="351">4</text><text x="520" y="351">5</text></g></g>
<rect x="103" y="485" width="628" height="38" rx="6" fill="#f8f4eb" stroke="#927b55" stroke-width="2" stroke-dasharray="9 6"/><text x="417" y="511" fill="#5a4a37" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">RESERVED PRODUCT INFORMATION AREA</text></g>
<g font-family="Arial,sans-serif"><text x="806" y="192" fill="#fff" font-size="20" font-weight="700">Design around the real pieces</text><text x="806" y="228" fill="#c8c6cc" font-size="16">Record the largest and smallest</text><text x="806" y="252" fill="#c8c6cc" font-size="16">dimensions in the assortment.</text><path d="M800 282h250" stroke="#51462a" stroke-width="2"/><text x="806" y="327" fill="#fff" font-size="20" font-weight="700">Support without squeezing</text><text x="806" y="363" fill="#c8c6cc" font-size="16">Check contact points, movement,</text><text x="806" y="387" fill="#c8c6cc" font-size="16">placement and removal in a sample.</text><path d="M800 417h250" stroke="#51462a" stroke-width="2"/><text x="806" y="462" fill="#fff" font-size="20" font-weight="700">Keep the label area usable</text><text x="806" y="498" fill="#c8c6cc" font-size="16">Confirm its position and clear space</text><text x="806" y="522" fill="#c8c6cc" font-size="16">before the insert and artwork are set.</text></g>
<text x="58" y="585" fill="#9f9ca4" font-family="Arial,sans-serif" font-size="14">Concept illustration only — not the buyer’s specific product, tray, or approved production design.</text>
