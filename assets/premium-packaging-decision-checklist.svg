<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Five checks before upgrading product packaging</title>
  <desc id="desc">A five-step buyer checklist: define the purpose, check product fit, test opening, compare the total packed cost and consider end of life.</desc>
  <rect width="1120" height="430" rx="24" fill="#0a0a0f"/>
  <text x="54" y="67" fill="#d6b45a" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">BEFORE YOU UPGRADE</text>
  <text x="54" y="112" fill="#f7f5ef" font-family="Arial,sans-serif" font-size="31" font-weight="700">Five checks for a premium box</text>
  <path d="M106 205H1014" fill="none" stroke="#6e5b31" stroke-width="3"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(48 158)">
      <circle cx="58" cy="47" r="31" fill="#18171a" stroke="#d6b45a" stroke-width="2"/>
      <text x="58" y="53" text-anchor="middle" fill="#d6b45a" font-size="16" font-weight="700">01</text>
      <rect x="0" y="96" width="206" height="124" rx="14" fill="#17161a" stroke="#353137"/>
      <text x="18" y="128" fill="#f7f5ef" font-size="18" font-weight="700">Purpose</text>
      <text x="18" y="158" fill="#c8c4bb" font-size="14">Gift, shelf or</text>
      <text x="18" y="180" fill="#c8c4bb" font-size="14">shipment?</text>
    </g>
    <g transform="translate(266 158)">
      <circle cx="58" cy="47" r="31" fill="#18171a" stroke="#d6b45a" stroke-width="2"/>
      <text x="58" y="53" text-anchor="middle" fill="#d6b45a" font-size="16" font-weight="700">02</text>
      <rect x="0" y="96" width="206" height="124" rx="14" fill="#17161a" stroke="#353137"/>
      <text x="18" y="128" fill="#f7f5ef" font-size="18" font-weight="700">Product fit</text>
      <text x="18" y="158" fill="#c8c4bb" font-size="14">Use the real</text>
      <text x="18" y="180" fill="#c8c4bb" font-size="14">packed items.</text>
    </g>
    <g transform="translate(484 158)">
      <circle cx="58" cy="47" r="31" fill="#18171a" stroke="#d6b45a" stroke-width="2"/>
      <text x="58" y="53" text-anchor="middle" fill="#d6b45a" font-size="16" font-weight="700">03</text>
      <rect x="0" y="96" width="206" height="124" rx="14" fill="#17161a" stroke="#353137"/>
      <text x="18" y="128" fill="#f7f5ef" font-size="18" font-weight="700">Opening</text>
      <text x="18" y="158" fill="#c8c4bb" font-size="14">Clear cue and</text>
      <text x="18" y="180" fill="#c8c4bb" font-size="14">comfortable lift.</text>
    </g>
    <g transform="translate(702 158)">
      <circle cx="58" cy="47" r="31" fill="#18171a" stroke="#d6b45a" stroke-width="2"/>
      <text x="58" y="53" text-anchor="middle" fill="#d6b45a" font-size="16" font-weight="700">04</text>
      <rect x="0" y="96" width="206" height="124" rx="14" fill="#17161a" stroke="#353137"/>
      <text x="18" y="128" fill="#f7f5ef" font-size="18" font-weight="700">Full cost</text>
      <text x="18" y="158" fill="#c8c4bb" font-size="14">Include assembly,</text>
      <text x="18" y="180" fill="#c8c4bb" font-size="14">carton and freight.</text>
    </g>
    <g transform="translate(920 158)">
      <circle cx="58" cy="47" r="31" fill="#18171a" stroke="#d6b45a" stroke-width="2"/>
      <text x="58" y="53" text-anchor="middle" fill="#d6b45a" font-size="16" font-weight="700">05</text>
      <rect x="0" y="96" width="152" height="124" rx="14" fill="#17161a" stroke="#353137"/>
      <text x="16" y="128" fill="#f7f5ef" font-size="17" font-weight="700">End of life</text>
      <text x="16" y="158" fill="#c8c4bb" font-size="13">Fewer, separable</text>
      <text x="16" y="180" fill="#c8c4bb" font-size="13">layers.</text>
    </g>
  </g>
  <text x="54" y="407" fill="#aaa59b" font-family="Arial,sans-serif" font-size="13">Approve the filled sample against the job you defined.</text>
</svg>
