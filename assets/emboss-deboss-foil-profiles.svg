<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="1080" height="410"><title>Embossing raises, debossing recesses, foil adds a finish</title><rect width="1080" height="410" rx="14" fill="#181820"/><g font-family="Arial,sans-serif"><text x="40" y="52" font-size="29" fill="#e0bc59">Choose relief and decoration separately</text><g fill="#eee" font-size="24"><text x="50" y="115">EMBOSS</text><text x="410" y="115">DEBOSS</text><text x="770" y="115">FLAT FOIL</text></g><g fill="none" stroke="#e9dfcc" stroke-width="12" stroke-linejoin="round"><path d="M45 225 H135 V180 H225 V225 H315"/><path d="M405 225 H495 V270 H585 V225 H675"/><path d="M765 225 H1035"/></g><path d="M850 218 H950" stroke="#e0bc59" stroke-width="8"/><g fill="#ccc" font-size="21"><text x="50" y="335">Raised above the surface</text><text x="410" y="335">Recessed into the surface</text><text x="770" y="335">Decorative surface finish</text><text x="40" y="385" font-size="17">Illustrative profiles only. Not to scale. Foil can also be combined with relief.</text></g></g></svg>