<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><title>Make the product order clear</title><style>text{font-family:Arial,sans-serif;fill:white}.h{font-size:36px;font-weight:bold}.s{font-size:21px;fill:#ccc}.g{font-size:25px;fill:#E8C96A}</style><rect width="1000" height="460" rx="16" fill="#12121a"/><text x="40" y="58" class="h">Make the product order clear</text><text x="40" y="104" class="s">Use the same hierarchy in the insert and product information.</text><rect x="40" y="140" width="295" height="258" rx="12" fill="#232330"/><text x="58" y="186" class="g">Main product</text><rect x="95" y="218" width="184" height="68" rx="5" fill="#9C8244"/><text x="58" y="335" class="s">Visible at the first reveal</text><text x="58" y="367" class="s">Label faces the viewer</text><rect x="350" y="140" width="295" height="258" rx="12" fill="#232330"/><text x="368" y="186" class="g">Supporting pieces</text><rect x="405" y="218" width="184" height="68" rx="5" fill="#9C8244"/><text x="368" y="335" class="s">Group by collection or use</text><text x="368" y="367" class="s">Leave space for fingers</text><rect x="660" y="140" width="295" height="258" rx="12" fill="#232330"/><text x="678" y="186" class="g">Information card</text><rect x="715" y="218" width="184" height="68" rx="5" fill="#9C8244"/><text x="678" y="335" class="s">Give it a separate position</text><text x="678" y="367" class="s">Keep the product visible</text><text x="40" y="438" class="s">CROWN WIN / Original schematic · Concepts only</text></svg>