<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><style>text{font-family:Arial,sans-serif;fill:white}.h{font-size:38px;font-weight:bold}.t{font-size:24px}.s{font-size:20px;fill:#c6c6d0}.g{font-size:25px;fill:#e8c96a;font-weight:bold}</style><rect x="1" y="1" width="998" height="518" rx="10" fill="#12121a" stroke="#37343b" stroke-width="2"/><text x="42" y="62" class="h">Approve the gift opening</text><text x="42" y="103" class="s">Four checks on the complete presentation sample.</text><rect x="42" y="132" width="448" height="138" rx="10" fill="#22222d" stroke="#c9a84c" stroke-width="2"/><text x="62" y="171" class="g">01  Close</text><text x="62" y="212" class="s">Check lid clearance</text><text x="62" y="239" class="s">with jewellery and card.</text><rect x="505" y="132" width="448" height="138" rx="10" fill="#22222d" stroke="#c9a84c" stroke-width="2"/><text x="525" y="171" class="g">02  Handle</text><text x="525" y="212" class="s">Look for movement</text><text x="525" y="239" class="s">after ordinary handling.</text><rect x="42" y="288" width="448" height="138" rx="10" fill="#22222d" stroke="#c9a84c" stroke-width="2"/><text x="62" y="327" class="g">03  Open</text><text x="62" y="368" class="s">Check the first view:</text><text x="62" y="395" class="s">pendant visible, card clear.</text><rect x="505" y="288" width="448" height="138" rx="10" fill="#22222d" stroke="#c9a84c" stroke-width="2"/><text x="525" y="327" class="g">04  Lift</text><text x="525" y="368" class="s">Watch for snagging</text><text x="525" y="395" class="s">or an unclear release.</text><text x="42" y="485" class="s">CROWN WIN / PACKAGING BUYER GUIDE</text><text x="740" y="485" class="s">Schematic · Not to scale</text></svg>