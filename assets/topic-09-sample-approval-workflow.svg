<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Four-step packaging sample approval workflow</title>
<desc id="desc">A planning graphic showing four stages: identify intent from the reference video, write a packaging specification, inspect the physical sample, and record the approved version and any open revisions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#1c1a20"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1c16a"/><stop offset="1" stop-color="#aa822d"/></linearGradient></defs>
<rect width="1280" height="360" rx="24" fill="url(#bg)"/><text x="52" y="55" fill="#c9a84c" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">A DOCUMENTED SAMPLE APPROVAL</text>
<g font-family="Arial,sans-serif"><g><rect x="50" y="92" width="258" height="190" rx="18" fill="#201f25" stroke="#6e5b34" stroke-width="2"/><circle cx="83" cy="128" r="19" fill="url(#gold)"/><text x="83" y="135" fill="#17161b" text-anchor="middle" font-size="18" font-weight="700">1</text><text x="113" y="135" fill="#f7f3eb" font-size="20" font-weight="700">Reference</text><text x="76" y="181" fill="#d9d2c7" font-size="16">Mark the visible details</text><text x="76" y="207" fill="#d9d2c7" font-size="16">and opening sequence.</text><text x="76" y="251" fill="#c9a84c" font-size="13" letter-spacing="1">VISUAL INTENT</text></g><path d="M316 187 H348" stroke="url(#gold)" stroke-width="5"/><path d="M348 179 L363 187 L348 195Z" fill="#c9a84c"/><g><rect x="367" y="92" width="258" height="190" rx="18" fill="#201f25" stroke="#6e5b34" stroke-width="2"/><circle cx="400" cy="128" r="19" fill="url(#gold)"/><text x="400" y="135" fill="#17161b" text-anchor="middle" font-size="18" font-weight="700">2</text><text x="430" y="135" fill="#f7f3eb" font-size="20" font-weight="700">Written brief</text><text x="393" y="181" fill="#d9d2c7" font-size="16">Dimensions, materials,</text><text x="393" y="207" fill="#d9d2c7" font-size="16">artwork, fit and scope.</text><text x="393" y="251" fill="#c9a84c" font-size="13" letter-spacing="1">DEFINED SPECIFICATION</text></g><path d="M633 187 H665" stroke="url(#gold)" stroke-width="5"/><path d="M665 179 L680 187 L665 195Z" fill="#c9a84c"/><g><rect x="684" y="92" width="258" height="190" rx="18" fill="#201f25" stroke="#6e5b34" stroke-width="2"/><circle cx="717" cy="128" r="19" fill="url(#gold)"/><text x="717" y="135" fill="#17161b" text-anchor="middle" font-size="18" font-weight="700">3</text><text x="747" y="135" fill="#f7f3eb" font-size="20" font-weight="700">Sample review</text><text x="710" y="181" fill="#d9d2c7" font-size="16">Check the actual box</text><text x="710" y="207" fill="#d9d2c7" font-size="16">against agreed points.</text><text x="710" y="251" fill="#c9a84c" font-size="13" letter-spacing="1">PHYSICAL CHECK</text></g><path d="M950 187 H982" stroke="url(#gold)" stroke-width="5"/><path d="M982 179 L997 187 L982 195Z" fill="#c9a84c"/><g><rect x="1001" y="92" width="229" height="190" rx="18" fill="#201f25" stroke="#6e5b34" stroke-width="2"/><circle cx="1034" cy="128" r="19" fill="url(#gold)"/><text x="1034" y="135" fill="#17161b" text-anchor="middle" font-size="18" font-weight="700">4</text><text x="1064" y="135" fill="#f7f3eb" font-size="20" font-weight="700">Record</text><text x="1027" y="181" fill="#d9d2c7" font-size="16">Version, revisions</text><text x="1027" y="207" fill="#d9d2c7" font-size="16">and approval scope.</text><text x="1027" y="251" fill="#c9a84c" font-size="13" letter-spacing="1">CLEAR HANDOFF</text></g></g>
<text x="640" y="326" fill="#bcb4a8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">An illustrative workflow · define any production or transit checks separately</text>
</svg>

